<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grupo LRL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo img {
    width: 230px;
    height: auto;
    display: block;
}

    nav a {
      margin-left: 25px;
      text-decoration: none;
      color: #333;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: #ffffff;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      color: #666;
      max-width: 650px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo-grupo-lrl.PNG" alt="Grupo LRL">
  </div>

  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#nosotros">Nosotros</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<section class="hero" id="inicio">

  <h1>Grupo LRL</h1>

  <p>
    Bienvenido al sitio oficial de Grupo LRL.
    Estamos construyendo un espacio para presentar nuestros
    proyectos, servicios y nuevas ideas.
  </p>

  <a class="button" href="#contacto">
    Contáctanos
  </a>

</section>

<footer id="contacto">
  © 2026 Grupo LRL. Todos los derechos reservados.
</footer>

</body>
</html>
